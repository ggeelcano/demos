<div class="envoltura">
  <nav class="migas" aria-label="Estás en"><ol id="migas"><li><a href="index.html">Inicio</a></li><li aria-current="page">Tienda</li></ol></nav>
  <header class="cab-listado">
    <h1 class="titulo-pagina" id="titulo">Todos los <span class="brocha">recambios</span></h1>
    <p class="desc" id="desc"></p>
  </header>
  <div class="barra-listado">
    <div class="izquierda"><button class="pildora btn-ocultar-filtros" id="btn-ocultar" type="button" aria-controls="filtros" aria-expanded="true"><svg class="ico" aria-hidden="true"><use href="#i-filtro"/></svg><span>Ocultar filtros</span></button></div>
    <div class="derecha">
      <button class="pildora btn-filtros-movil" id="btn-filtros" type="button" aria-controls="filtros" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-filtro"/></svg>Filtros <strong id="n-filtros"></strong></button>
      <div class="pildora pildora-orden"><span class="n-res"><strong id="n-res">0</strong> productos</span><span aria-hidden="true">·</span><label class="solo-lector" for="orden">Ordenar por</label><select id="orden"><option value="rel">Relevancia</option><option value="nov">Novedades</option><option value="pre-asc">Más baratos</option><option value="pre-desc">Más caros</option></select></div>
      <button class="pildora btn-vista" id="btn-vista" type="button" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-mosaico"/></svg><span>Mosaico</span></button>
    </div>
  </div>
  <p class="n-movil" aria-hidden="true"><strong id="n-res-m">0</strong> productos</p>
  <p class="solo-lector" id="estado-res" role="status"></p>
  <div class="listado" id="listado">
    <aside class="filtros" id="filtros" aria-label="Filtros" data-siempre>
      <div class="filtros-cab"><h2>Filtros</h2><button class="btn-cerrar" type="button" data-cerrar aria-label="Cerrar filtros"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div>
      <div class="caja-mimoto" id="caja-mimoto"></div>
      <label class="interruptor destacado"><input type="checkbox" id="f-stock"><span class="pista"></span><span>Solo con stock <span class="n" id="n-stock"></span></span></label>
      <div class="grupo-filtro"><h2 id="t-cats">Categorías</h2><ul id="f-cats" aria-labelledby="t-cats"></ul></div>
      <div class="grupo-filtro"><h2 id="t-precio">Precio</h2><ul id="f-precio" aria-labelledby="t-precio"></ul></div>
      <div class="grupo-filtro"><h2 id="t-otros">Más filtros</h2><ul aria-labelledby="t-otros">
        <li><label class="interruptor"><input type="checkbox" id="f-nov"><span class="pista"></span><span>Novedades <span class="n" id="n-nov"></span></span></label></li>
        <li><label class="interruptor"><input type="checkbox" id="f-uni"><span class="pista"></span><span>Piezas universales <span class="n" id="n-uni"></span></span></label></li>
      </ul></div>
      <div class="filtros-pie"><button class="btn btn-naranja btn-ancho" type="button" data-cerrar id="ver-res">Ver productos</button></div>
    </aside>
    <section aria-labelledby="titulo">
      <div id="aviso-moto"></div>
      <div class="resultados" id="resultados"></div>
      <div class="mas-resultados" id="mas"></div>
    </section>
  </div>
</div>
