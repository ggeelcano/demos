<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL Margen · Asistente de reservas por WhatsApp</title>
<meta name="description" content="Ejemplo del asistente de WhatsApp de AL Margen: contesta al momento, completa los datos de la reserva, resuelve dudas de la carta y del menú degustación y deja cada mesa lista para validar.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#008069">
<meta property="og:title" content="AL Margen · Asistente de reservas">
<meta property="og:description" content="Escribe como si fueras un cliente: «mesa para 4 el sábado a las 2 y media». Completa lo que falte, responde dudas de la carta y deja la reserva lista para validar.">
<meta property="og:image" content="https://ggeelcano.github.io/demos/almargen/img/og.jpg?v=1">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://ggeelcano.github.io/demos/almargen/">
<meta property="og:site_name" content="AL Margen · Asistente">
<meta property="og:type" content="website">
<link rel="icon" href="img/avatar.png" type="image/png">
<link rel="apple-touch-icon" href="img/avatar.png">
<style>
  :root{
    --verde:#008069; --verde2:#00a884; --fondo:#efeae2; --mio:#d9fdd3; --otro:#fff; --tinta:#111b21; --gris:#667781; --enlace:#027eb5;
    --nota:#fff8d6; --nota-b:#f0d95c; --sombra:0 1px .5px rgba(11,20,26,.13);
  }
  *{box-sizing:border-box}
  html{height:100%;overflow-x:hidden}
  body{margin:0;min-height:100%;font-family:"Segoe UI",Helvetica,Roboto,Arial,sans-serif;color:var(--tinta);background:#d1d7db;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:127px;background:var(--verde2);z-index:0}
  .skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:6px;z-index:10}
  .skip:focus{left:8px}
  .movil{position:relative;z-index:1;width:100%;max-width:440px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--fondo);box-shadow:0 6px 18px rgba(11,20,26,.25);overflow:hidden}
  @media (min-width:700px){
    body{padding:20px 16px}
    .movil{height:min(860px,calc(100vh - 40px));border-radius:14px}
  }
  .cab{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 8px;background:var(--verde);color:#fff;min-height:60px;flex:0 0 auto}
  .cab .atras{width:24px;height:32px;display:grid;place-items:center;font-size:22px;opacity:.95;flex:0 0 auto}
  .avatar{width:40px;height:40px;border-radius:50%;background:#f9f9f9;flex:0 0 auto;overflow:hidden;display:grid;place-items:center;color:#222;font-weight:700}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .cab .quien{flex:1;min-width:0;line-height:1.2}
  .cab .nombre{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab .estado{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab button,.cab a{background:none;border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;text-decoration:none;flex:0 0 auto}
  .cab button:hover,.cab button:focus-visible,.cab a:hover,.cab a:focus-visible{background:rgba(255,255,255,.15);outline:2px solid #fff;outline-offset:-4px}
  .chat{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 8% 12px;display:flex;flex-direction:column;gap:3px;
    background-color:var(--fondo);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23c9c1b5' stroke-width='1.2' opacity='.55'><circle cx='20' cy='20' r='6'/><path d='M60 12l4 8 8 2-6 6 1 8-7-4-7 4 1-8-6-6 8-2z'/><rect x='90' y='16' width='14' height='14' rx='3'/><path d='M14 70c8-10 20-10 28 0'/><circle cx='70' cy='72' r='9'/><path d='M96 62v20M86 72h20'/><path d='M22 104h20M32 94v20'/><circle cx='66' cy='104' r='5'/><path d='M92 98l12 12M104 98l-12 12'/></g></svg>");}
  @media (max-width:420px){.chat{padding-left:12px;padding-right:12px}}
  .chip{align-self:center;background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:var(--sombra);margin:4px 0 8px;text-align:center;max-width:100%}
  .chip.aviso{background:#fdf6d3;color:#54656f}
  .chip.sistema{background:#e1f2fb;color:#3b5560;margin-top:12px;animation:pop .2s ease-out}
  .msg{position:relative;max-width:88%;padding:6px 8px 8px 9px;border-radius:8px;box-shadow:var(--sombra);font-size:14.5px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .18s ease-out}
  .msg a{color:var(--enlace)}
  .msg.otro{align-self:flex-start;background:var(--otro);border-top-left-radius:0}
  .msg.mio{align-self:flex-end;background:var(--mio);border-top-right-radius:0}
  .msg.otro::before,.msg.mio::before{content:"";position:absolute;top:0;width:0;height:0;border:8px solid transparent}
  .msg.otro::before{left:-8px;border-top-color:var(--otro);border-right-color:var(--otro);border-left:0}
  .msg.mio::before{right:-8px;border-top-color:var(--mio);border-left-color:var(--mio);border-right:0}
  .msg .hora{display:inline-block;float:right;margin:8px 0 -4px 10px;font-size:11px;color:var(--gris);white-space:nowrap}
  .msg.mio .hora::after{content:" ✓✓";color:#53bdeb;letter-spacing:-2px}
  .msg.otro + .msg.otro,.msg.mio + .msg.mio{margin-top:1px}
  .msg.otro + .msg.otro::before,.msg.mio + .msg.mio::before{display:none}
  .msg.otro + .msg.otro{border-top-left-radius:8px}
  .msg.mio + .msg.mio{border-top-right-radius:8px}
  .opciones{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%;margin:4px 0 6px;animation:pop .2s ease-out}
  .opciones button{background:#fff;border:0;border-radius:18px;padding:7px 12px;color:var(--enlace);font:inherit;font-size:13.5px;font-weight:500;box-shadow:var(--sombra);cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
  .opciones button:hover,.opciones button:focus-visible{background:#eef8ff;outline:2px solid var(--enlace);outline-offset:-2px}
  .ficha{align-self:stretch;margin:10px 0 6px;background:var(--nota);border:1px solid var(--nota-b);border-radius:10px;padding:10px 12px 12px;box-shadow:var(--sombra);animation:pop .2s ease-out}
  .ficha h2{margin:0 0 2px;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .ficha .sub{font-size:12px;color:#6b6340;margin:0 0 8px}
  .ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
  .ficha dt{color:#6b6340;font-weight:600}
  .ficha dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
  .ficha .alta{color:#b42318;font-weight:600}
  .ficha .btn{display:inline-block;margin-top:10px;background:var(--verde);color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:600}
  .ficha .btn:hover,.ficha .btn:focus-visible{background:#02685a;outline:2px solid #02685a;outline-offset:2px}
  .typing{display:inline-flex;gap:4px;padding:6px 2px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:t 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes t{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .barra{flex:0 0 auto;display:flex;align-items:flex-end;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#f0f2f5}
  .barra button{border:0;background:none;width:42px;height:42px;border-radius:50%;font-size:22px;color:#54656f;cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
  .barra button:focus-visible{outline:2px solid var(--verde);outline-offset:-2px}
  .barra .enviar{background:var(--verde);color:#fff;font-size:18px}
  .barra .enviar:disabled{opacity:.55;cursor:default}
  .barra textarea{flex:1;min-width:0;resize:none;border:0;border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;line-height:1.3;max-height:110px;background:#fff;color:var(--tinta)}
  .barra textarea:focus{outline:2px solid var(--verde);outline-offset:-2px}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#texto">Ir al cuadro de escritura</a>
<main class="movil" aria-label="Conversación de ejemplo con el asistente de AL Margen">
  <header class="cab">
    <span class="atras" aria-hidden="true">‹</span>
    <div class="avatar" id="avatar"><img src="img/avatar.png" alt="" onerror="this.remove();document.getElementById('avatar').textContent='AL'"></div>
    <div class="quien">
      <div class="nombre">AL Margen</div>
      <div class="estado" id="estado">Asistente · en línea</div>
    </div>
    <a href="panel.html" id="verpanel" aria-label="Ver el panel de reservas" title="Panel de reservas">📅</a>
    <button type="button" id="reiniciar" aria-label="Empezar la conversación de nuevo" title="Empezar de nuevo">↻</button>
  </header>
  <section class="chat" id="chat" role="log" aria-live="polite" aria-label="Mensajes">
    <div class="chip">Hoy</div>
    <div class="chip aviso">Demo · Escribe como si fueras un cliente de AL Margen: «mesa para 4 el sábado a las 2 y media», una duda de la carta o del menú degustación, el horario… Lo que escribas se guarda solo en este dispositivo.</div>
  </section>
  <form class="barra" id="barra" autocomplete="off">
    <label for="texto" class="visually-hidden">Escribe un mensaje</label>
    <textarea id="texto" rows="1" placeholder="Escribe un mensaje" enterkeyhint="send"></textarea>
    <button type="submit" class="enviar" id="enviar" aria-label="Enviar">➤</button>
  </form>
</main>

<script src="datos.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  const M = window.Margen;
  const $ = s => document.querySelector(s);
  const chat = $("#chat"), texto = $("#texto"), enviarBtn = $("#enviar"), estado = $("#estado");
  let g, conv, reserva, ocupado = false;

  const hora = () => new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const abajo = () => { chat.scrollTop = chat.scrollHeight; };
  const espera = ms => new Promise(r => setTimeout(r, ms));

  function burbuja(contenido, quien) {
    const d = document.createElement("div"); d.className = "msg " + quien;
    // los enlaces (Google Maps) se pueden pulsar, como en WhatsApp
    for (const trozo of contenido.split(/(https?:\/\/[^\s]+)/)) {
      if (/^https?:\/\//.test(trozo)) { const a = document.createElement("a"); a.href = trozo; a.textContent = trozo; a.target = "_blank"; a.rel = "noopener"; d.appendChild(a); }
      else if (trozo) d.appendChild(document.createTextNode(trozo));
    }
    const h = document.createElement("span"); h.className = "hora"; h.textContent = hora(); d.appendChild(h);
    chat.appendChild(d); abajo(); return d;
  }
  function aviso(t) { const d = document.createElement("div"); d.className = "chip sistema"; d.textContent = t; chat.appendChild(d); abajo(); }
  function escribiendo(on) {
    let t = $("#typing");
    if (on && !t) { t = document.createElement("div"); t.id = "typing"; t.className = "msg otro"; t.innerHTML = '<span class="typing" aria-label="Escribiendo"><i></i><i></i><i></i></span>'; chat.appendChild(t); abajo(); estado.textContent = "escribiendo…"; }
    if (!on && t) { t.remove(); estado.textContent = "Asistente · en línea"; }
  }
  function quitarChips() { chat.querySelectorAll(".opciones").forEach(e => e.remove()); }
  function chips(opciones) {
    quitarChips();
    if (!opciones || !opciones.length) return;
    const d = document.createElement("div"); d.className = "opciones"; d.setAttribute("role", "group"); d.setAttribute("aria-label", "Respuestas rápidas");
    for (const o of opciones) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = o;
      b.addEventListener("click", () => { quitarChips(); enviar(o); });
      d.appendChild(b);
    }
    chat.appendChild(d); abajo();
  }
  function pintarFicha(f) {
    const previa = chat.querySelector(".ficha:not(.vieja)"); if (previa) previa.remove();
    const a = document.createElement("article"); a.className = "ficha";
    a.innerHTML = '<h2>📅 Reserva que recibiría AL Margen</h2><p class="sub">Así le llega al equipo, ya ordenada en su panel. El cliente no ve esta tarjeta.</p>';
    const dl = document.createElement("dl");
    for (const [k, v] of f.campos) {
      const dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = k; dd.textContent = v;
      if (k === "Avisos" || k === "Preguntas sin contestar") dd.className = "alta";
      dl.append(dt, dd);
    }
    a.appendChild(dl);
    const btn = document.createElement("a"); btn.className = "btn"; btn.href = "panel.html"; btn.textContent = "Ver el panel de reservas"; a.appendChild(btn);
    chat.appendChild(a); abajo();
  }
  function guardarReserva(f) {
    const datos = { ficha: f, conversacion: conv.slice() };
    if (!reserva) reserva = M.anadir({ id: M.nuevoId(), fecha: new Date().toISOString(), estado: "nuevo", ejemplo: false, ...datos });
    else M.actualizar(reserva.id, s => { Object.assign(s, datos); if (f.datos.cancelada) s.estado = "cancelada"; });
  }

  async function enviar(contenido) {
    if (ocupado) return;
    ocupado = true; enviarBtn.disabled = true; quitarChips();
    burbuja(contenido, "mio");
    conv.push({ quien: "cliente", texto: contenido });
    escribiendo(true);
    await espera(650 + Math.min(900, contenido.length * 6));
    let r;
    try { r = M.responder(g, contenido); } catch (e) { r = { texto: "Uy, se me ha cruzado algo. ¿Me lo repites de otra forma?" }; console.error(e); }
    escribiendo(false);
    // tras una cancelación, la siguiente reserva es otra distinta en el panel
    if (r.reinicio) { reserva = null; chat.querySelectorAll(".ficha").forEach(e => e.classList.add("vieja")); }
    if (r.sistema) { aviso(r.sistema); conv.push({ quien: "sistema", texto: r.sistema }); }
    burbuja(r.texto, "otro");
    conv.push({ quien: "asistente", texto: r.texto });
    if (r.ficha) { await espera(450); pintarFicha(r.ficha); guardarReserva(r.ficha); }
    chips(r.opciones);
    ocupado = false; enviarBtn.disabled = false;
    if (!r.opciones && document.activeElement !== document.body) texto.focus();
  }

  function arrancar() {
    chat.querySelectorAll(".msg,.ficha,.opciones,.chip.sistema").forEach(e => e.remove());
    g = M.nuevoEstado(); conv = [{ quien: "asistente", texto: M.APERTURA }]; reserva = null;
    escribiendo(true);
    setTimeout(() => { escribiendo(false); burbuja(M.APERTURA, "otro"); chips(M.OPCIONES_INICIO); }, 700);
  }

  $("#barra").addEventListener("submit", e => {
    e.preventDefault();
    const v = texto.value.trim(); if (!v) return;
    texto.value = ""; texto.style.height = "auto";
    enviar(v);
  });
  texto.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#barra").requestSubmit(); } });
  texto.addEventListener("input", () => { texto.style.height = "auto"; texto.style.height = Math.min(texto.scrollHeight, 110) + "px"; });
  $("#reiniciar").addEventListener("click", arrancar);
  M.sembrar();
  arrancar();
})();
</script>
</body>
</html>
